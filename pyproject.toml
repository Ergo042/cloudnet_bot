[project]
name = "nonebot-plugin-cloudnet-bot"
version = "0.1.0"
description = "A NoneBot2 plugin for Cloudnet bot."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "nonebot2>=2.0.0",
    "nonebot-adapter-onebot>=2.0.0",
    "nonebot-plugin-htmlkit>=0.2.0",
    "nonebot-plugin-apscheduler>=0.3.0",
    "pymysql>=1.0.0",
    "aiohttp>=3.8.0",
]

[project.license]
text = "MIT"

[tool.nonebot]
plugins = ["cloudnet_bot"]
plugin_dirs = []